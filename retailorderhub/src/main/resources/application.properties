spring.application.name=retailorderhub

# H2 in-memory database — resets on every restart, zero setup required
spring.datasource.url=jdbc:h2:mem:retailorderhub;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always

# H2 console for poking at the DB directly during training — do not enable this in production
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080
